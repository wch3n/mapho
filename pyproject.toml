[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapho"
version = "0.1.0"
description = "MAPHO: Many-body Potential-based Hamiltonian Operator"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "e3nn>=0.4.4,<0.6",
    "mace-torch>=0.3.16,<0.4",
    "numpy>=1.24",
    "ase>=3.22",
    "h5py>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
fields = ["scipy>=1.10"]
references = ["pymatgen>=2025.1"]
dev = ["ruff==0.16.5"]

[project.scripts]
mapho = "mapho.cli:main"
mapho-qe = "mapho.qe.backend:main"
mapho-fields = "mapho.field_train:main"
mapho-vasp = "mapho.commands.vasp:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mapho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml"]
target-version = "py310"
line-length = 88
force-exclude = true
extend-exclude = [
    "runs",
    "build",
    "dist",
    "docs/archive",
    "docs/build_mapho_report",
    ".venv-qe",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
